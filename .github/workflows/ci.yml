name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # local production build + mock sheet + headless Chrome (preinstalled on ubuntu-latest); never touches production
      - run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm audit --omit=dev --audit-level=high
